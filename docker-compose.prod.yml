name: salary-settlement-admin

services:
  api:
    image: salary-settlement-api:${RELEASE_IMAGE_TAG:?set RELEASE_IMAGE_TAG to an immutable release identifier}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${PRODUCTION_ENV_FILE:-/opt/salary-settlement-admin/shared/.env}
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      PORT: "3000"
    extra_hosts:
      - "host.docker.internal:172.30.80.1"
    networks:
      - app
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: salary-settlement-web:${RELEASE_IMAGE_TAG:?set RELEASE_IMAGE_TAG to an immutable release identifier}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL before building}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app:
    name: salary-settlement-admin_app
    external: true
