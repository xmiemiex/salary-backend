name: release-preflight

on:
  pull_request:
  workflow_dispatch:

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: Asia/Shanghai
      API_CREDENTIAL_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      SYNC_PLANNER_ENABLED: 'false'
      SYNC_AUTO_EXECUTION_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Add PowerShell compatibility command
        shell: bash
        run: |
          sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          powershell --version

      - name: Prepare local environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env -Force

      - name: Start database
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @salary/shared build
          pnpm db:up
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed

      - name: Prepare explicit CI-only release fixture
        shell: pwsh
        env:
          CI_RELEASE_FIXTURE_ENABLED: 'true'
        run: pnpm release:ci-fixture

      - name: Release preflight
        shell: pwsh
        run: pnpm release:preflight

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: tmp/release-evidence
